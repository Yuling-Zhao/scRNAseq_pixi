[workspace]
channels = ["conda-forge", "bioconda"]
name = "TG"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]

[feature.part1-feature.dependencies]
sra-tools = "*"
fastqc = "*"
multiqc = "*"
samtools = "*"

[feature.part2-feature.dependencies]
r-base = ">=4.3"
r-seurat = ">=5.4.0,<6"
r-seuratobject = ">=5.3.0,<6"
bioconductor-scater = ">=1.34.1,<2"
bioconductor-singlecellexperiment = ">=1.28.0,<2"
bioconductor-scdblfinder = ">=1.23.4,<2"
bioconductor-dropletutils = ">=1.26.0,<2"
r-soupx = ">=1.6.2,<2"
r-fnn = ">=1.1.4.1,<2"
r-cluster = ">=2.1.8.1,<3"
r-reshape2 = ">=1.4.5,<2"
r-dplyr = ">=1.1.4,<2"
r-ggplot2 = ">=3.5.2,<3.6"
r-irkernel = ">=1.3.2,<2"
jupyter = ">=1.1.1,<2"

[feature.part3-feature.dependencies]
r-harmony = "*"
bioconductor-batchelor = { channel = "bioconda" }
r-ggplot2 = ">=4.0.3,<5"
r-patchwork = ">=1.3.2,<2"
r-ggalluvial = ">=0.12.6,<0.13"
r-viridis = ">=0.6.5,<0.7"
r-rcolorbrewer = ">=1.1_3,<2"
r-ggrepel = ">=0.9.8,<0.10"
jupyter = ">=1.1.1,<2"
r-irkernel = ">=1.3.2,<2"

[feature.part4-feature.dependencies]
bioconductor-singler = "*"
r-hgnchelper = ">=0.8.15,<0.9"
r-openxlsx = ">=4.2.8.1,<5"
bioconductor-celldex = ">=1.20.0,<2"
jupyter = ">=1.1.1,<2"
r-irkernel = ">=1.3.2,<2"

[environments]
part1 = ["part1-feature"]
part2 = ["part2-feature"]
part3 = ["part3-feature"]
part4 = ["part4-feature"]
